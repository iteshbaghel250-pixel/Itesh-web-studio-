<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Itesh Baghel | Web Developer</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#fff;
    color:#111827;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}

/* LOADER */
#loader{
    position:fixed;
    inset:0;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:99999;
    transition:.6s;
}

#loader.hide{
    opacity:0;
    visibility:hidden;
}

.loader{
    text-align:center;
}

.spinner{
    width:65px;
    height:65px;
    border:5px solid #ede9fe;
    border-top-color:#7c3aed;
    border-right-color:#2563eb;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin:auto auto 20px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

.loader h2{
    color:#111827;
}

.loader p{
    color:#777;
    margin-top:7px;
}

/* NAVBAR */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:18px 7%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:rgba(255,255,255,.9);
    backdrop-filter:blur(15px);
    border-bottom:1px solid #eee;
    z-index:1000;
}

.logo{
    font-size:25px;
    font-weight:900;
    color:#7c3aed;
}

.logo span{
    color:#2563eb;
}

nav ul{
    display:flex;
    gap:30px;
    list-style:none;
}

nav ul a{
    color:#111827;
    font-weight:600;
}

nav ul a:hover{
    color:#7c3aed;
}

.nav-btn{
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    color:white;
    padding:12px 22px;
    border-radius:30px;
}

/* HERO */
.hero{
    min-height:100vh;
    padding:130px 7% 80px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:60px;
    background:
    radial-gradient(circle at 80% 20%,#ede9fe,transparent 30%),
    radial-gradient(circle at 10% 80%,#dbeafe,transparent 30%);
}

.hero-text{
    max-width:680px;
}

.badge{
    display:inline-block;
    padding:9px 17px;
    border-radius:30px;
    background:#f3f0ff;
    color:#7c3aed;
    border:1px solid #ddd6fe;
    font-weight:bold;
    margin-bottom:20px;
}

.hero h1{
    font-size:clamp(48px,7vw,85px);
    line-height:1;
    margin-bottom:25px;
}

.gradient{
    background:linear-gradient(90deg,#7c3aed,#2563eb);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero p{
    color:#6b7280;
    font-size:18px;
    line-height:1.7;
    margin-bottom:30px;
}

.buttons{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.btn{
    display:inline-block;
    padding:15px 27px;
    border-radius:35px;
    font-weight:bold;
    transition:.3s;
}

.primary{
    color:white;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    box-shadow:0 15px 35px rgba(124,58,237,.25);
}

.primary:hover{
    transform:translateY(-4px);
}

.outline{
    color:#7c3aed;
    border:1px solid #ddd6fe;
}

.outline:hover{
    background:#f5f3ff;
}

/* PHOTO */
.photo-card{
    width:390px;
    height:500px;
    padding:8px;
    border-radius:35px;
    background:linear-gradient(135deg,#7c3aed,#2563eb,#06b6d4);
    box-shadow:0 30px 80px rgba(37,99,235,.25);
    transform:rotate(3deg);
}

.photo-inner{
    width:100%;
    height:100%;
    overflow:hidden;
    border-radius:29px;
    background:#eee;
}

.photo-inner img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

/* SECTIONS */
section{
    padding:100px 7%;
}

.section-title{
    text-align:center;
    margin-bottom:55px;
}

.section-title span{
    color:#7c3aed;
    font-weight:bold;
}

.section-title h2{
    font-size:45px;
    margin-top:10px;
}

/* SERVICES */
.services{
    background:#f8f7ff;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:25px;
}

.card{
    background:white;
    padding:32px;
    border-radius:25px;
    border:1px solid #ede9fe;
    transition:.3s;
}

.card:hover{
    transform:translateY(-9px);
    box-shadow:0 20px 50px rgba(124,58,237,.12);
}

.icon{
    width:60px;
    height:60px;
    border-radius:18px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:#f3f0ff;
    font-size:27px;
    margin-bottom:20px;
}

.card h3{
    margin-bottom:12px;
    font-size:22px;
}

.card p{
    color:#6b7280;
    line-height:1.6;
}

/* PROJECTS */
.project{
    min-height:300px;
    padding:30px;
    border-radius:28px;
    color:white;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    background:linear-gradient(135deg,#7c3aed,#2563eb);
    transition:.3s;
}

.project:hover{
    transform:translateY(-8px);
}

.project:nth-child(2){
    background:linear-gradient(135deg,#2563eb,#0891b2);
}

.project:nth-child(3){
    background:linear-gradient(135deg,#9333ea,#ec4899);
}

.project h3{
    font-size:28px;
    margin-bottom:8px;
}

/* PRICING */
.pricing{
    background:#f8f7ff;
}

.price{
    font-size:40px;
    color:#7c3aed;
    font-weight:900;
    margin:15px 0 20px;
}

.price ul{
    list-style:none;
    margin-bottom:25px;
}

.price li{
    padding:9px 0;
    color:#666;
}

.price li::before{
    content:"✓ ";
    color:#7c3aed;
    font-weight:bold;
}

.featured{
    border:2px solid #7c3aed;
    transform:scale(1.04);
}

/* ABOUT */
.about{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:60px;
    align-items:center;
}

.about h2{
    font-size:45px;
    margin-bottom:20px;
}

.about p{
    color:#666;
    line-height:1.8;
}

.about-box{
    padding:45px;
    border-radius:30px;
    background:linear-gradient(135deg,#f5f3ff,#eff6ff);
}

/* STATS */
.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:20px;
}

.stat{
    text-align:center;
    padding:30px;
    background:#f8f7ff;
    border-radius:22px;
}

.stat h3{
    font-size:40px;
    color:#7c3aed;
}

.stat p{
    color:#777;
}

/* CONTACT */
.contact{
    background:#0d0d10;
    color:white;
    text-align:center;
}

.contact h2{
    font-size:50px;
    margin-bottom:20px;
}

.contact p{
    color:#aaa;
    margin-bottom:30px;
}

/* FOOTER */
footer{
    background:#0d0d10;
    color:#777;
    text-align:center;
    padding:25px;
    border-top:1px solid #222;
}

/* MOBILE */
@media(max-width:900px){

    nav ul{
        display:none;
    }

    .hero{
        flex-direction:column;
        text-align:center;
    }

    .buttons{
        justify-content:center;
    }

    .photo-card{
        width:320px;
        height:420px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .about{
        grid-template-columns:1fr;
    }

    .featured{
        transform:none;
    }

    .stats{
        grid-template-columns:1fr 1fr;
    }
}

@media(max-width:500px){

    nav{
        padding:16px 5%;
    }

    .nav-btn{
        padding:10px 15px;
        font-size:13px;
    }

    .hero{
        padding-left:5%;
        padding-right:5%;
    }

    section{
        padding:70px 5%;
    }

    .hero h1{
        font-size:48px;
    }

    .photo-card{
        width:285px;
        height:370px;
    }

    .section-title h2{
        font-size:35px;
    }

    .contact h2{
        font-size:38px;
    }
}
</style>
</head>
